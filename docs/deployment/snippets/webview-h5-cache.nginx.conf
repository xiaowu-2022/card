# Include only in the consumer H5 HTTPS server, ahead of generic static regex locations.
# Keep existing H5 root/alias routing. Not for the Platform administration server.
# For root-mounted H5, its existing root must resolve /assets to public/h5/assets.
# Repeat existing server-level security add_header directives in these locations
# when required by the deployment (nginx add_header inheritance).
location ~ ^/(?:h5/)?assets/[^/]+[.\-][A-Za-z0-9_\-]{8}\.(?:js|css|woff2?|ttf|otf|png|jpe?g|webp|svg|gif|avif)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /h5/index.html {
    add_header Cache-Control "no-cache";
}
location = /h5/ {
    index index.html;
    add_header Cache-Control "no-cache";
}
location = /h5/build-manifest.json {
    add_header Cache-Control "no-cache";
}

# Root-mounted H5 only: the server document root must already be public/h5.
# Keep these out if / is served by Laravel or another proxy/location.
# location = / { index index.html; add_header Cache-Control "no-cache"; }
# location = /index.html { add_header Cache-Control "no-cache"; }
# location = /build-manifest.json { add_header Cache-Control "no-cache"; }
