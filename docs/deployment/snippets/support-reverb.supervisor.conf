[program:card-support-reverb]
command=/usr/bin/php /www/wwwroot/card/artisan reverb:start --host=127.0.0.1 --port=8080
; Replace PHP path and service user with the site's existing PHP 8.4/application user.
directory=/www/wwwroot/card
user=www
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/www/wwwroot/card/storage/logs/support-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; For large installations set minfds in the existing [supervisord] section and
; choose a Reverb-supported scalable event-loop extension on the server.
