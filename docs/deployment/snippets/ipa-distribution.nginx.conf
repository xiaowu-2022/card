# Merge into the HTTPS consumer virtual host whose root is .../public/h5.
# The distribution files and IPA packages are stored in public/h5/ipa.
# Keep the existing PHP-FPM .php location and all existing security headers.
# The configured download destination is /ipa (without a trailing slash).
# Match it explicitly before the site's H5/Laravel fallback handles the request.
location = /ipa {
    return 302 /ipa/$is_args$args;
}
location = /ipa/ {
    index index.php;
}
location ~* ^/ipa/[^/]+\.ipa$ {
    try_files $uri =404;
    types { application/octet-stream ipa; }
    add_header Cache-Control "no-store";
}
location ~* ^/ipa/.*\.(?:part|upload)$ {
    return 404;
}
# /ipa/index.php must be handled by the site's existing PHP-FPM configuration.
# Do not place /ipa under a ^~ static-only location, or enable directory autoindex.

# A server-level rewrite ... /index.html last; runs before locations. Move
# the H5 fallback into location / or explicitly exclude /ipa and /ipa/ paths.
# PHP-FPM SCRIPT_FILENAME must resolve to $document_root/ipa/index.php.
